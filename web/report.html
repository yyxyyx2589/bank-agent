<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>评估报告 — Bank Agent 三基线对比</title>
<style>
  :root {
    --bg: #f7f8fa; --panel: #ffffff; --border: #e4e7ed;
    --text: #1f2329; --dim: #646a73;
    --rag: #3370ff; --lora: #00b2a9; --agent: #7a3df0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); padding: 24px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  header {
    display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
  }
  header h1 { font-size: 20px; }
  header a { font-size: 13px; color: var(--rag); text-decoration: none; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; margin-bottom: 18px;
  }
  .card h2 { font-size: 14px; color: var(--dim); margin-bottom: 16px; font-weight: 600; }

  /* 柱状图 */
  .chart { display: flex; justify-content: space-around; align-items: flex-end;
           height: 220px; padding: 10px 0; }
  .metric-group { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bars { display: flex; gap: 14px; align-items: flex-end; height: 170px; }
  .bar { width: 44px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar .val { font-size: 11px; color: var(--dim); margin-bottom: 3px; }
  .bar .col { width: 100%; border-radius: 4px 4px 0 0; min-height: 2px; }
  .bar .lbl { font-size: 10px; color: var(--dim); margin-top: 5px; text-align: center; }
  .metric-name { font-size: 12px; font-weight: 600; }
  .legend { display: flex; gap: 18px; justify-content: center; margin-top: 10px; }
  .legend span { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* 表格 */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 600; font-size: 12px; }
  td b { color: var(--agent); }
  .best { color: #34c38f; font-weight: 700; }

  /* 说明 */
  .note p { font-size: 13px; color: var(--dim); line-height: 1.8; margin-bottom: 8px; }
  .note b { color: var(--text); }
  .empty { text-align: center; color: var(--dim); padding: 60px 0; font-size: 14px; }
  .empty code { background: #f0f2f5; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>三基线评估报告</h1>
    <a href="/">← 返回对话</a>
  </header>

  <div id="content"><div class="empty">加载中…</div></div>
</div>

<script>
const BASE_META = {
  rag:      { name: "纯 RAG",   color: "#3370ff" },
  rag_lora: { name: "RAG+LoRA", color: "#00b2a9" },
  agent:    { name: "Agent",    color: "#7a3df0" },
};
const METRICS_CHART = [
  { key: "answer_score_avg",   name: "端到端解决率" },
  { key: "route_accuracy_avg", name: "路由准确率" },
  { key: "tool_accuracy_avg",  name: "工具选择准确率" },
];
const METRICS_TABLE = [
  { key: "answer_score_avg",   name: "端到端解决率",   fmt: v => (v*100).toFixed(1) + "%" },
  { key: "route_accuracy_avg", name: "路由准确率",     fmt: v => (v*100).toFixed(1) + "%" },
  { key: "tool_accuracy_avg",  name: "工具选择准确率", fmt: v => (v*100).toFixed(1) + "%" },
  { key: "param_accuracy_avg", name: "参数生成准确率", fmt: v => (v*100).toFixed(1) + "%" },
  { key: "turns_avg",          name: "平均轮次",       fmt: v => v.toFixed(2) },
  { key: "latency_ms_avg",     name: "平均延迟",       fmt: v => v + " ms" },
  // 分路由延迟：整体均值会被"大多数题走直答"掩盖，看不出代价花在哪条路径上
  { key: "latency_by_route",   name: "分路由延迟",     noBest: true,
    fmt: v => Object.entries(v).map(([k, n]) => `${ROUTE_CN[k] || k} ${n}ms`).join(" / ") },
  { key: "count",              name: "测试条数",       fmt: v => v },
];
const ROUTE_CN = { rag_direct: "直答", agent_loop: "工具循环", refuse_human: "转人工" };

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}

function renderChart(data){
  const active = Object.keys(BASE_META).filter(bl => data[bl]);
  let groups = "";
  for(const m of METRICS_CHART){
    let bars = "";
    for(const bl of active){
      const meta = BASE_META[bl];
      const agg = data[bl] && data[bl].aggregate;
      const val = agg ? (agg[m.key] || 0) : 0;
      const h = Math.max(2, Math.round(val * 150));
      bars += `<div class="bar">
        <span class="val">${(val*100).toFixed(0)}%</span>
        <div class="col" style="height:${h}px;background:${meta.color}"></div>
        <span class="lbl">${meta.name}</span>
      </div>`;
    }
    groups += `<div class="metric-group">
      <div class="bars">${bars}</div>
      <span class="metric-name">${m.name}</span>
    </div>`;
  }
  const legend = active.map(bl =>
    `<span><i class="dot" style="background:${BASE_META[bl].color}"></i>${BASE_META[bl].name}</span>`).join("");
  return `<div class="card">
    <h2>基线对比（准确率类指标，越高越好）</h2>
    <div class="chart">${groups}</div>
    <div class="legend">${legend}</div>
  </div>`;
}

function renderTable(data){
  const cols = Object.keys(BASE_META).filter(bl => data[bl]);
  let head = "<tr><th>指标</th>" + cols.map(bl => `<th>${BASE_META[bl].name}</th>`).join("") + "</tr>";
  let rows = "";
  for(const m of METRICS_TABLE){
    // 找每行最优值（准确率类取最大，轮次/延迟取最小）；noBest 行（如分路由延迟）不参与
    const vals = cols.map(bl => data[bl].aggregate[m.key]);
    const isLowerBetter = m.key === "turns_avg" || m.key === "latency_ms_avg";
    let best;
    if(!m.noBest){
      best = isLowerBetter ? Math.min(...vals.filter(v=>v!==undefined))
                           : Math.max(...vals.filter(v=>v!==undefined));
    }
    rows += `<tr><td>${m.name}</td>` + cols.map((bl, i) => {
      const v = vals[i];
      const cell = v === undefined ? "—" : m.fmt(v);
      return `<td class="${v===best ? 'best':''}">${cell}</td>`;
    }).join("") + "</tr>";
  }
  return `<div class="card"><h2>完整指标（绿色为最优基线）</h2>
    <table>${head}${rows}</table></div>`;
}

function renderNote(data){
  let stabLine = "";
  const stA = data && data.agent && data.agent.stability;      // Agent 的稳定性
  const stR = data && data.rag && data.rag.stability;          // 纯 RAG 的稳定性
  const stL = data && data.rag_lora && data.rag_lora.stability; // 本地小模型的稳定性
  if (stA && stA.runs > 1) {
    // 注意：各基线各自的波动要各取各的 stability 块，不能共用一份
    // 极差为 0 时写成「恒为 X%」——否则会显示成 "66.7% ~ 66.7%"，看着像 bug
    const range = (st, m) => {
      if(!st || !st[m]) return "—";
      const lo = (st[m].min*100).toFixed(1), hi = (st[m].max*100).toFixed(1);
      return lo === hi ? `恒为 ${lo}%（极差 0）` : `${lo}% ~ ${hi}%`;
    };
    const stableAll = ["answer_score_avg","route_accuracy_avg","tool_accuracy_avg","param_accuracy_avg"]
      .every(m => stA[m] && stA[m].min === stA[m].max);
    stabLine = `<p><b>稳定性</b>：本报告为 <b>${stA.runs} 次重复运行的均值</b>
      （<code>python eval.py --baseline all --repeat ${stA.runs}</code>），而非单跑一次的结果。
      Agent 的端到端解决率、路由准确率、工具选择与参数准确率在 ${stA.runs} 次运行中
      ${stableAll ? "<b>完全一致（极差 0）</b>，即上表 100% 不是运气" :
      "波动极小"}；纯 RAG 的解决率在 ${range(stR, "answer_score_avg")} 之间波动${
      stL ? `，本地小模型（贪心解码）${range(stL, "answer_score_avg")}` : ""} ——
      稳定性上的差别，本身就是「有据可依」和「靠模型即兴发挥」的差别。</p>`;
  }
  return `<div class="card note">
    <h2>方法论说明（面试讲这部分）</h2>
    <p><b>测试集</b>：银行坐席业务问题，覆盖三类——知识类（产品利率、制度条款，
    期望知识库直答）、多源类（需组合工单 + 业务规则 + 费率才能回答，期望 Agent 调工具）、
    超纲类（知识库外的投资建议、闲聊、非本行业务，期望转人工）。</p>
    <p><b>三基线</b>：纯 RAG（只检索+直答，云端大模型）/
    RAG+LoRA（本地 Qwen2.5-1.5B + 银行域 LoRA，私有化部署方案）/
    Agent（本项目：决策路由 + 工具循环）。中间那条基线的检索链路与纯 RAG
    <b>完全一致，唯一变量就是「谁在作答」</b>——这样差异才能归因到模型，
    而不是被链路上的其他改动混淆。</p>
    <p><b>指标定义</b>：端到端解决率 = 答案命中标注要点的比例（空白归一化后匹配）；
    <b>路由准确率</b> = 实际走的分支（直答 / 工具循环 / 转人工）与标注期望一致的比例，
    纯 RAG 与 RAG+LoRA 无路由概念、一律计为直答；工具选择准确率 = 期望工具集被实际调用的比例；
    参数准确率 = 工具参数与标注匹配的比例（字符串双向包含，因参数由模型从自然语言抽取）；
    平均轮次 = Agent 达到答案的工具调用次数；延迟 = 单题处理耗时。</p>
    <p><b>结论</b>：知识类（知识库能覆盖、且不涉及精确数字）三条基线都能答；
    多源类只有 Agent 能答——工单状态、精确费率、条件判定这些答案不在知识库里，
    检索再准也拿不到，必须调工具查表；
    超纲类只有 Agent 有转人工兜底（另外两条会硬答）。
    对银行场景来说最后这条不是性能差异，而是<b>合规差异</b>——宁可转人工，
    也不能让模型对着没有依据的问题编一个听起来合理的答案。路由准确率正是把
    这条合规差异量化成一个数字。</p>
    <p><b>训练数据的泄漏防护</b>：中间基线的 LoRA 是用本项目的知识库语料自建的
    （<code>training/build_sft.py</code>），因此必须防止它「背答案」。
    构建脚本设了两道闸门：与评测题完全相同的问题剔除、与评测题字符相似度 ≥0.72
    的问题也剔除（第一版只做精确匹配时剔除了 0 条，但实际存在 8 条近重复——
    例如训练问「银行卡丢了要怎么补办呢」对标评测题「银行卡丢了怎么补办」）。
    另外<b>刻意没有</b>把产品表/业务规则表里的精确数字训进去——那正是 Agent
    才能拿到的信息，训进去会让中间基线靠记忆虚高，污染对比。
    诚实边界：评测期望要点本身是知识库里的<b>事实</b>，事实层面的重合无法也不应
    避免（避免它就等于要求模型不许知道业务知识）。</p>
    ${stabLine}
  </div>`;
}

fetch("/api/eval-report")
  .then(r => r.json())
  .then(data => {
    const box = document.getElementById("content");
    if(!data || Object.keys(data).length === 0){
      box.innerHTML = `<div class="empty">
        暂无评估数据。先运行：<br><br>
        <code>python eval.py --baseline all</code><br><br>
        （需要设置 DEEPSEEK_API_KEY，约消耗 ¥5 以内）
      </div>` + renderNote(null);
      return;
    }
    box.innerHTML = renderChart(data) + renderTable(data) + renderNote(data);
  })
  .catch(() => {
    document.getElementById("content").innerHTML =
      `<div class="empty">加载失败，请确认服务已启动</div>`;
  });
</script>
</body>
</html>
